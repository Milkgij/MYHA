name: Import Tinkers source and build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-tconstruct.yml']

permissions:
  contents: write

jobs:
  import-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPSTREAM_SHA: '1c98a9e43115931574b8017193b2c48982aa184d'
      PORT_BRANCH: 'neoforge-1.21.1'
    steps:
      - name: Checkout MYHA
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Fetch exact upstream source revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.21.1 https://github.com/Zazow/TinkersConstruct-1.21.1.git "$RUNNER_TEMP/tconstruct-upstream"
          actual="$(git -C "$RUNNER_TEMP/tconstruct-upstream" rev-parse HEAD)"
          if [[ "$actual" != "$UPSTREAM_SHA" ]]; then
            git -C "$RUNNER_TEMP/tconstruct-upstream" fetch --depth=1 origin "$UPSTREAM_SHA"
            git -C "$RUNNER_TEMP/tconstruct-upstream" checkout --detach "$UPSTREAM_SHA"
          fi
          test "$(git -C "$RUNNER_TEMP/tconstruct-upstream" rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -f "$RUNNER_TEMP/tconstruct-upstream/gradlew"
          test -f "$RUNNER_TEMP/tconstruct-upstream/src/main/resources/META-INF/neoforge.mods.toml"
          test -f "$RUNNER_TEMP/tconstruct-upstream/LICENSE"

      - name: Import source into independent branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$PORT_BRANCH" >/dev/null 2>&1; then
            echo "Branch $PORT_BRANCH already exists. Refusing to overwrite."
            exit 1
          fi
          git switch -c "$PORT_BRANCH"
          cp LICENSE MYHA_LICENSE.txt
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='javac.*.args' "$RUNNER_TEMP/tconstruct-upstream/" ./
          cp "$RUNNER_TEMP/tconstruct-upstream/README.md" UPSTREAM_README.md
          chmod +x gradlew
          printf '%s\n' "$UPSTREAM_SHA" > UPSTREAM_COMMIT.txt
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Import pinned NeoForge 1.21.1 Tinkers source"
          git push origin "HEAD:refs/heads/$PORT_BRANCH"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Java mod
        run: ./gradlew --no-daemon --max-workers=2 assemble --stacktrace

      - name: Verify built JAR descriptor
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then exit 1; fi
          for jar in "${jars[@]}"; do
            if unzip -Z1 "$jar" | grep -qx 'META-INF/neoforge.mods.toml'; then
              unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'tconstruct'
              echo "Verified $jar"
              exit 0
            fi
          done
          echo "No built JAR contains NeoForge mod metadata"
          exit 1

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: tinkers-neoforge-1.21.1-unofficial
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
