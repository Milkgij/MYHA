name: NeoForge 1.21.1 build

on:
  push:
    branches: [neoforge-1.21.1]
  pull_request:
    branches: [neoforge-1.21.1]

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble source
        run: ./gradlew --no-daemon --max-workers=2 assemble --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tinkers-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
